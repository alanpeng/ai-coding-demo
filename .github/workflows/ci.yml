name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: npm test (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci` and no cache step, on purpose: this repo has zero
      # dependencies, so CI must never depend on the npm registry being reachable.
      - name: Run tests
        run: npm test
